[package]
name = "astralane-alt-cache"
version = "4.2.2"
edition = "2024"
description = "In-memory Solana ALT service with confirmed Yellowstone updates"
repository = "https://github.com/Astralane/alt-cache"

[dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
bs58 = "0.5"
dashmap = "6"
futures = "0.3"
im = "15"
jsonrpsee = { version = "0.26", features = ["macros", "server"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
signal-hook = "0.3"
solana-account-decoder-client-types = { version = "=4.2.2", features = ["agave-unstable-api", "zstd"] }
solana-address = "=2.6.1"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.2.3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.9"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
yellowstone-grpc-client = "=13.1.1"
yellowstone-grpc-proto = "=12.6.0"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
