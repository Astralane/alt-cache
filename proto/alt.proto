syntax = "proto3";
package astralane.alt.v1;

import "geyser.proto";

service AltCache {
  rpc Get(GetRequest) returns (GetResponse);
  // Snapshot and updates share one sequence. Reconnect for a fresh snapshot on error.
  rpc Subscribe(SubscribeRequest) returns (stream Update);
}
message GetRequest { bytes pubkey = 1; }
message GetResponse {
  string epoch = 1;
  uint64 sequence = 2;
  uint64 processed_slot = 3;
  optional geyser.SubscribeUpdateAccountInfo account = 4;
  optional uint64 account_slot = 5;
}
message SubscribeRequest { bool updates = 1; }
message Update {
  enum Kind { SNAPSHOT_ACCOUNT = 0; SNAPSHOT_END = 1; UPSERT = 2; DELETE = 3; }
  string epoch = 1;
  uint64 sequence = 2;
  Kind kind = 3;
  optional geyser.SubscribeUpdateAccountInfo account = 4;
  bytes pubkey = 5;
  uint64 processed_slot = 6;
}
